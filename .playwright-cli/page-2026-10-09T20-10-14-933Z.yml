      - text: and we'll get back to you soon.
    - paragraph [ref=e30]:
      - strong [ref=e31]: "Invite your partner:"
      - text: Settings → "Send join link". Your partner installs HoneyMom, signs in with their own email and chooses "Join with code".
    - paragraph [ref=e32]:
      - strong [ref=e33]: "One purchase per family:"
      - text: a single one-time purchase unlocks the app for every parent. Already bought? Tap "Restore purchases" on the purchase screen.
    - paragraph [ref=e34]:
      - strong [ref=e35]: "Delete your account:"
      - text: Settings → "Delete account".
