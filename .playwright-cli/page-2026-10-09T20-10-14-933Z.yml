  - generic [ref=e8]:
    - heading "תמיכה" [level=1] [ref=e9]
    - paragraph [ref=e10]: יש שאלה או משהו לא עובד? כתבו לנו ונחזור אליכם בהקדם.
    - paragraph [ref=e11]:
      - text: "מייל:"
      - link "honeymom.app@gmail.com" [ref=e12] [cursor=pointer]:
        - /url: mailto:honeymom.app@gmail.com
    - heading "איך מצרפים את בן/בת הזוג?" [level=2] [ref=e13]
    - paragraph [ref=e14]: בהגדרות לוחצים על "שליחת קישור הצטרפות" ושולחים את הקישור. בן/בת הזוג מורידים את HoneyMom, נכנסים עם המייל שלהם ובוחרים "הצטרפות עם קוד". הקוד מופיע גם בהגדרות.
    - heading "האם כל הורה צריך לקנות?" [level=2] [ref=e15]
    - paragraph [ref=e16]: לא. רכישה אחת פותחת את האפליקציה לכל ההורים במשפחה, בלי מנוי ובלי חיובים חוזרים.
    - heading "קניתי, אבל האפליקציה עדיין מבקשת לרכוש" [level=2] [ref=e17]
    - paragraph [ref=e18]: במסך הרכישה לוחצים על "שחזור רכישות", מאותו חשבון Apple שאיתו קניתם. אם זה לא עוזר, כתבו לנו במייל.
    - heading "איך מוסיפים את הווידג'ט?" [level=2] [ref=e19]
    - paragraph [ref=e20]: לוחצים לחיצה ארוכה על מסך הבית של האייפון, מקישים על "+" ובוחרים HoneyMom.
    - heading "איך מוחקים את החשבון?" [level=2] [ref=e21]
    - paragraph [ref=e22]: בהגדרות לוחצים על "מחיקת חשבון". אם אתם ההורה היחיד במשפחה, כל הנתונים של התינוק נמחקים לצמיתות.
    - paragraph [ref=e23]:
      - link "מדיניות פרטיות" [ref=e24] [cursor=pointer]:
